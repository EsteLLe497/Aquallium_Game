<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <pattern id="tiles" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#aeb8c5"/>
      <path d="M48 0H0V48" fill="none" stroke="#697684" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#55d9ff"/>
    </marker>
    <style>
      .title{font:700 42px 'Yu Gothic',sans-serif;fill:#eef7ff}
      .sub{font:20px 'Yu Gothic',sans-serif;fill:#9dc9e6}
      .label{font:700 22px 'Yu Gothic',sans-serif;fill:#eef7ff}
      .small{font:17px 'Yu Gothic',sans-serif;fill:#b7d3e6}
      .dim{font:700 19px 'Yu Gothic',sans-serif;fill:#ffd166}
      .wall{fill:#142538;stroke:#4c6d85;stroke-width:3}
      .fixture{fill:#153b55;stroke:#64cff1;stroke-width:3}
      .door{fill:#15445d;stroke:#83e5ff;stroke-width:4}
      .inactive{fill:#0b1723;stroke:#5d7181;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="80" y="78" class="title">受付フロア 設計図 V1 — KEY 9</text>
  <text x="82" y="112" class="sub">閉館後の公共施設 / 外扉 → 無人チケット確認 → 大水槽フロア</text>

  <!-- 15.0 m x 7.5 m plan, scale 76 px per metre -->
  <g transform="translate(185 205)">
    <rect x="0" y="0" width="1140" height="570" fill="url(#tiles)" stroke="#7195ae" stroke-width="12"/>

    <!-- North wall and direct hero-hall threshold -->
    <rect x="0" y="0" width="270" height="24" class="wall"/>
    <rect x="726" y="0" width="414" height="24" class="wall"/>
    <rect x="270" y="0" width="456" height="24" fill="#0d789d" stroke="#74e8ff" stroke-width="3"/>
    <text x="498" y="-18" text-anchor="middle" class="label">大水槽フロアへ直接接続</text>

    <!-- South wall and locked exterior double glass doors -->
    <rect x="0" y="546" width="479" height="24" class="wall"/>
    <rect x="661" y="546" width="479" height="24" class="wall"/>
    <rect x="479" y="534" width="91" height="36" class="door"/>
    <rect x="570" y="534" width="91" height="36" class="door"/>
    <path d="M479 570A91 91 0 0 1 570 479M661 570A91 91 0 0 0 570 479" fill="none" stroke="#7ddffc" stroke-width="2" stroke-dasharray="8 7" opacity=".7"/>
    <text x="570" y="612" text-anchor="middle" class="label">施錠された両開きガラス扉</text>
    <text x="570" y="638" text-anchor="middle" class="small">外部は暗黒 / 将来の調査対象</text>

    <!-- Three human ticket inspection counters, not automatic station gates -->
    <g>
      <rect x="333" y="86" rx="20" width="112" height="82" class="fixture"/>
      <rect x="514" y="86" rx="20" width="112" height="82" class="fixture"/>
      <rect x="695" y="86" rx="20" width="112" height="82" class="fixture"/>
      <path d="M445 127H514M626 127H695" stroke="#a6efff" stroke-width="5"/>
      <text x="570" y="205" text-anchor="middle" class="label">無人チケット確認カウンター ×3</text>
      <text x="570" y="232" text-anchor="middle" class="small">常時通行可能 / 有効通路幅 1.0 m以上</text>
    </g>

    <!-- Curved reception, northeast / right rear from exterior view -->
    <path d="M850 56H1110V306H1050V155C1050 116 1018 86 978 86H850Z" class="fixture"/>
    <path d="M850 86H978C1018 86 1050 116 1050 155V306" fill="none" stroke="#9beaff" stroke-width="5"/>
    <text x="971" y="190" text-anchor="middle" class="label">総合受付</text>
    <text x="971" y="218" text-anchor="middle" class="small">曲面カウンター</text>
    <path d="M1025 24H1093V56H1025Z" class="door"/>
    <path d="M1018 48L950 65" fill="none" stroke="#9dc9e6" stroke-width="2"/>
    <text x="942" y="54" text-anchor="end" class="small">従業員専用扉</text>
    <text x="942" y="77" text-anchor="end" class="small">将来の暗号ギミック</text>
    <rect x="1080" y="70" width="18" height="18" fill="#a9ffcf" stroke="#e9fff2" stroke-width="3"/>
    <text x="1089" y="110" text-anchor="middle" class="small">非常灯1灯</text>

    <!-- Inactive recessed downlights -->
    <g opacity=".8">
      <circle cx="140" cy="165" r="12" class="inactive"/><circle cx="140" cy="390" r="12" class="inactive"/>
      <circle cx="365" cy="360" r="12" class="inactive"/><circle cx="570" cy="360" r="12" class="inactive"/>
      <circle cx="775" cy="360" r="12" class="inactive"/><circle cx="995" cy="410" r="12" class="inactive"/>
    </g>

    <!-- Main player circulation -->
    <path d="M570 510V285V180V42" fill="none" stroke="#55d9ff" stroke-width="9" stroke-linecap="round" stroke-dasharray="15 11" marker-end="url(#arrow)"/>
    <text x="590" y="430" class="small">主要動線</text>

    <!-- Dimensions -->
    <path d="M0 650V690M1140 650V690M0 675H1140" stroke="#ffd166" stroke-width="3"/>
    <path d="M0 666V684M1140 666V684" stroke="#ffd166" stroke-width="3"/>
    <rect x="515" y="654" width="110" height="32" rx="8" fill="#07111f"/>
    <text x="570" y="678" text-anchor="middle" class="dim">15.0 m</text>
    <path d="M-48 0H-88M-48 570H-88M-72 0V570" stroke="#ffd166" stroke-width="3"/>
    <path d="M-81 0H-63M-81 570H-63" stroke="#ffd166" stroke-width="3"/>
    <text x="-105" y="285" transform="rotate(-90 -105 285)" text-anchor="middle" class="dim">7.5 m</text>
  </g>

  <g transform="translate(90 900)">
    <text x="0" y="0" class="label">固定仕様</text>
    <text x="0" y="38" class="small">• 天井高 4.5 m　• 清潔な館内　• 青暗い色調　• 家具・植物・券売機なし</text>
    <text x="0" y="70" class="small">• 点灯：受付内の非常灯1灯のみ　• ダウンライトは器具のみで消灯</text>
    <text x="0" y="102" class="small">• 床：淡い灰色の光沢タイル　• 壁：既存館内と共通の濃紺パネル</text>
  </g>

  <g transform="translate(1030 878)">
    <rect width="470" height="145" rx="18" fill="#0b1928" stroke="#3f6b86" stroke-width="3"/>
    <text x="24" y="38" class="label">ゲーム実装時の境界</text>
    <text x="24" y="72" class="small">外扉：Solid + Interaction（施錠）</text>
    <text x="24" y="101" class="small">職員扉：Solid + FuturePuzzle</text>
    <text x="24" y="130" class="small">受付・確認台：Solid / 通路：Walkable</text>
  </g>
</svg>
